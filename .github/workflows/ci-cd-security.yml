name: CI/CD sentinel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sentinel-ai/backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: sentinel-ai/backend/requirements.txt

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Lint with flake8
        run: flake8 app --max-line-length=120 --ignore=E501,W503

  test:
    runs-on: ubuntu-latest
    needs: quality
    defaults:
      run:
        working-directory: sentinel-ai/backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: sentinel-ai/backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run unit tests
        run: |
          if [ -d app/tests ]; then
            python -m pytest app/tests -v
          else
            echo "No app/tests directory found, skipping tests."
          fi

  build-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ./sentinel-ai/backend
          file: ./sentinel-ai/backend/Dockerfile
          push: true
          tags: ${{ secrets.USERNAME }}/fill_rouge_sentinel:latest
