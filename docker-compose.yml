services:
  # Frontend Service
  frontend:
    build:
      context: ./sentinel-ai/frontend
      dockerfile: Dockerfile
    container_name: sentinel-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - sentinelai-network
    # command: npm start
    restart: unless-stopped

  # RTSP Server
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: sentinel-mediamtx
    ports:
      - "8554:8554" # RTSP
      - "8888:8888" # HLS
      - "8889:8889" # WebRTC
    networks:
      - sentinelai-network
    restart: unless-stopped

  # Sample RTSP feeder (loops a local video into live.stream)
  rtsp-feeder:
    image: jrottenberg/ffmpeg:6.1-alpine
    container_name: sentinel-rtsp-feeder
    entrypoint: ["ffmpeg"]
    command:
      - "-re"
      - "-stream_loop"
      - "-1"
      - "-i"
      - "/workspace/images/teting/gfviolence.mp4"
      - "-rtsp_transport"
      - "tcp"
      - "-c:v"
      - "mpeg4"
      - "-q:v"
      - "3"
      - "-r"
      - "15"
      - "-f"
      - "rtsp"
      - "rtsp://mediamtx:8554/live.stream"
    volumes:
      - ./model_training/images:/workspace/images:ro
    depends_on:
      - mediamtx
    networks:
      - sentinelai-network
    restart: unless-stopped

  # YOLO RTSP processor (reads live.stream, publishes yolo.stream)
  yolo-rtsp:
    build: ./model_training
    image: sentinelai-fr
    container_name: sentinel-yolo-rtsp
    command: ["python", "/workspace/scripts/rtsp_yolo_stream.py"]
    volumes:
      - ./model_training/runs:/workspace/runs
    environment:
      - MODEL_PATH=/workspace/runs/detect/runs/1yolov8m_realy_violence2_test_v3/weights/best.pt
      - INPUT_RTSP_URL=rtsp://mediamtx:8554/live.stream
      - OUTPUT_RTSP_URL=rtsp://mediamtx:8554/yolo.stream
      - RTSP_TRANSPORT=tcp
      - FRAME_WIDTH=640
      - FRAME_HEIGHT=640
      - FPS=12
      - OUTPUT_ENCODER=auto
      - PROCESS_EVERY_NTH_FRAME=2
      - MAX_READ_FAILURES=40
      - RECONNECT_DELAY_SECONDS=2
    depends_on:
      - mediamtx
      - rtsp-feeder
    networks:
      - sentinelai-network
    restart: unless-stopped

  # Model Training Service with GPU support
  jupyter:
    build: ./model_training
    image: sentinelai-fr
    container_name: sentinel-jupyter
    ports:
      - "8890:8888"
    volumes:
      - ./model_training/images:/workspace/images
      - ./model_training/runs:/workspace/runs
      - ./model_training/notebooks:/workspace/notebooks
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - sentinelai-network
    restart: unless-stopped

  # Backend API Service
  backend:
    build: ./sentinel-ai/backend
    container_name: sentinel-backend
    ports:
      - "8000:8000"
    volumes:
      - ./sentinel-ai/backend:/workspace
      - ./sentinel-ai/backend/data:/workspace/data
    env_file:
      - ./sentinel-ai/.env
    depends_on:
      - db
      - redis
      - mlflow
      - qdrant
      - ollama
      - mediamtx
    networks:
      - sentinelai-network
    restart: unless-stopped
  
  # Qdrant Vector Database (RAG)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: sentinel-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - sentinelai-network
    restart: unless-stopped

  # Ollama LLM Service (RAG)
  ollama:
    image: ollama/ollama:latest
    container_name: sentinel-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - sentinelai-network
    restart: unless-stopped


  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: sentinel-db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=sentinel
    ports:
      - "5432:5432"
    networks:
      - sentinelai-network
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: sentinel-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - sentinelai-network
    restart: unless-stopped

  # PgAdmin for Database Management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sentinel-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@sentinel.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db
    networks:
      - sentinelai-network
    restart: unless-stopped

  # MLflow Experiment Tracking
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: sentinel-mlflow
    command:
      - mlflow
      - server
      - --backend-store-uri
      - sqlite:///mlflow/mlflow.db
      - --default-artifact-root
      - /mlflow/artifacts
      - --host
      - 0.0.0.0
      - --port
      - "5000"
    environment:
    - MLFLOW_HTTP_ALLOW_HOST_VARIATION=true
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    networks:
      - sentinelai-network
    restart: unless-stopped

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: sentinel-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - backend
    networks:
      - sentinelai-network
    restart: unless-stopped

  # Grafana Dashboarding
  grafana:
    image: grafana/grafana-oss:latest
    container_name: sentinel-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - sentinelai-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
  qdrant_data:
  ollama_data:
  mlflow_data:
  prometheus_data:
  grafana_data:

networks:
  sentinelai-network:
    driver: bridge
